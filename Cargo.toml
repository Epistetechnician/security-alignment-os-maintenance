[package]
name = "security-alignment-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Claim-bounded, capability-gated agent security controls"
license = "MIT"

[dependencies]
aws-nitro-enclaves-nsm-api = "=0.4.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
sha2 = "0.10"
thiserror = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "std", "zeroize"] }

[dev-dependencies]
tempfile = "3"
